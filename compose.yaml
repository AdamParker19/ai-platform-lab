services:
  inference:
    build: ./inference-service
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  gateway:
    build: ./api-gateway
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INFERENCE_URL: http://inference:8000
      INFERENCE_TIMEOUT_MS: "3000"
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
