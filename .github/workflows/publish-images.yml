name: Publish images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-main
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish both images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 501683248889.dkr.ecr.ap-south-1.amazonaws.com
      IMAGE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference-service/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json
      - name: Run Python tests
        working-directory: inference-service
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Run TypeScript tests and build
        working-directory: api-gateway
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate and build containers
        run: |
          docker compose config --quiet
          docker compose build
      - name: Wait for healthy containers
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Test prediction through the gateway
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:3000/health", timeout=5) as response:
              assert response.status == 200

          request = urllib.request.Request(
              "http://127.0.0.1:3000/api/analyze",
              data=json.dumps({"text": "This product is amazing"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              result = json.load(response)
              assert response.status == 200
              assert response.headers.get("x-request-id")
          assert result["prediction"] == "positive", result
          assert 0 <= result["confidence"] <= 1, result
          assert result["modelVersion"] == "sentiment-demo-v1", result
          print("Gateway-to-inference integration passed:", result)
          PY
      - name: Request temporary publishing credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::501683248889:role/ai-platform-lab-github-publisher
          role-session-name: github-publish-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "501683248889"
          retry-max-attempts: 3
          unset-current-credentials: true
      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "501683248889"
          mask-password: "true"
      - name: Publish the tested images
        shell: bash
        run: |
          for service in gateway inference; do
            image_id=$(docker compose images --quiet "$service" | sort -u)
            if [[ -z "$image_id" || "$image_id" == *$'\n'* ]]; then
              echo "Expected exactly one built image for $service"
              exit 1
            fi
            image_uri="$ECR_REGISTRY/ai-platform-lab/$service:$IMAGE_TAG"
            docker tag "$image_id" "$image_uri"
            docker push "$image_uri"
            image_digest=$(docker image inspect "$image_uri" --format '{{index .RepoDigests 0}}')
            echo "### $service" >> "$GITHUB_STEP_SUMMARY"
            echo "- Image: $image_uri" >> "$GITHUB_STEP_SUMMARY"
            echo "- Digest: $image_digest" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Images published. ECS deployment was not requested." >> "$GITHUB_STEP_SUMMARY"
      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans
