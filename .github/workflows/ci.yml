name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/service-boilerplate, feat/llm-extraction, feat/supplier-grounding, feat/versioned-sentiment-aws, feat/sagemaker-serving]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inference-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: inference-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference-service/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Test deployment and smoke safeguards without AWS access
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  gateway-tests:
    name: TypeScript tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Typecheck evaluation scripts and tests
        run: npx tsc --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --strict --esModuleInterop --skipLibCheck scripts/verify-live.ts tests/provenance.test.ts tests/evaluation.test.ts tests/prompt-candidate.test.ts tests/grounding.test.ts

  sagemaker-container:
    name: SageMaker serving container
    needs: [inference-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build model archive with serving dependencies
        run: docker build --platform linux/amd64 -f inference-service/Dockerfile.sagemaker --target artifacts --output type=local,dest=./sagemaker-output inference-service
      - name: Build inference-only image
        run: docker build --platform linux/amd64 -f inference-service/Dockerfile.sagemaker --target runtime -t ai-platform-lab-sagemaker:test inference-service
      - name: Mount model archive and start with SageMaker's serve argument
        run: |
          mkdir -p sagemaker-output/model
          tar -xzf sagemaker-output/model.tar.gz -C sagemaker-output/model
          docker run --detach --name sagemaker-contract -p 127.0.0.1:18080:8080 \
            --mount "type=bind,source=$PWD/sagemaker-output/model,target=/opt/ml/model,readonly" \
            ai-platform-lab-sagemaker:test serve
      - name: Verify readiness and prediction over HTTP
        run: python3 scripts/smoke_sagemaker.py
      - name: Show serving logs
        if: always()
        run: docker logs sagemaker-contract || true
      - name: Remove local container
        if: always()
        run: docker rm --force sagemaker-contract || true

  containers:
    name: Docker build and integration
    needs: [inference-tests, gateway-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start and wait for healthy services
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Test prediction through the gateway
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:3000/health", timeout=5) as response:
              assert response.status == 200

          request = urllib.request.Request(
              "http://127.0.0.1:3000/api/analyze",
              data=json.dumps({"text": "This product is amazing"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              result = json.load(response)
              assert response.status == 200
              assert response.headers.get("x-request-id")
          assert result["prediction"] in {"positive", "negative"}, result
          assert 0 <= result["confidence"] <= 1, result
          assert result["modelVersion"] == "sentiment-uci-amazon-v1", result
          print("Gateway-to-inference integration passed:", result)
          PY
      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans
